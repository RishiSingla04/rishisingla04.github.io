{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="login-mark">＄</div>
  <h1 class="login-heading">LEDGER</h1>
  <p class="login-sub">Family passcode required</p>
  <form method="post" class="card login-card">
    <label for="passcode">Passcode</label>
    <input type="password" id="passcode" name="passcode" inputmode="text" autocomplete="current-password" autofocus required>
    <button type="submit" class="btn btn-primary">Enter</button>
  </form>
</div>
{% endblock %}
