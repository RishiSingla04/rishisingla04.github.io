{% extends "base.html" %}
{% block title %}Record sale{% endblock %}
{% block content %}
<section class="card">
  <h2 class="section-heading">Record a sale</h2>
  {% if products %}
  <form method="post" class="stack-form">
    <label for="product_id">Product</label>
    <select id="product_id" name="product_id" required>
      {% for p in products %}
      <option value="{{ p['id'] }}" {{ 'disabled' if p['quantity_in_stock'] <= 0 }}>
        {{ p['name'] }} — {{ p['quantity_in_stock'] }} in stock
      </option>
      {% endfor %}
    </select>

    <label for="sale_price">Sale price per unit ($)</label>
    <input type="number" id="sale_price" name="sale_price" min="0" step="0.01" inputmode="decimal" required>

    <label for="quantity">Quantity sold</label>
    <input type="number" id="quantity" name="quantity" min="1" step="1" inputmode="numeric" value="1" required>

    <button type="submit" class="btn btn-primary">Record sale</button>
  </form>
  {% else %}
  <p class="empty-note">No products yet — add one from the Product tab first.</p>
  {% endif %}
</section>
{% endblock %}
