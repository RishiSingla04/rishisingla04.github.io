{% extends "base.html" %}
{% block title %}Add product{% endblock %}
{% block content %}
<section class="card">
  <h2 class="section-heading">Add or restock a product</h2>
  <p class="hint">If the name matches an existing product, this adds to its current stock instead of creating a duplicate.</p>
  <form method="post" class="stack-form">
    <label for="name">Product name</label>
    <input type="text" id="name" name="name" required autocomplete="off">

    <label for="cost_price">Cost per unit ($)</label>
    <input type="number" id="cost_price" name="cost_price" min="0" step="0.01" inputmode="decimal" required>

    <label for="quantity">Quantity to add</label>
    <input type="number" id="quantity" name="quantity" min="1" step="1" inputmode="numeric" required>

    <button type="submit" class="btn btn-primary">Save product</button>
  </form>
</section>
{% endblock %}
